<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Casa &amp; Spesa" />
  <meta name="theme-color" content="#d4d4d8" />
  <title>Casa &amp; Spesa</title>
  <style>
    :root {
      --bg-base: #e4e4e7;
      --bg-gradient: radial-gradient(circle at 15% 10%, #f4f4f5 0%, #e4e4e7 45%, #d4d4d8 100%);
      --glass: rgba(255, 255, 255, 0.58);
      --glass-strong: rgba(255, 255, 255, 0.78);
      --border-glass: rgba(255, 255, 255, 0.72);
      --border-subtle: rgba(113, 113, 122, 0.22);
      --text-main: #18181b;
      --text-muted: #52525b;
      --accent: #3f3f46;
      --accent-hover: #27272a;
      --danger-soft: rgba(185, 28, 28, 0.12);
      --danger-text: #991b1b;
      --warn-soft: rgba(161, 98, 7, 0.14);
      --warn-text: #854d0e;
      --pill: 9999px;
      --oval: 36px;
      --shadow-soft: 0 10px 30px rgba(24, 24, 27, 0.08);
      --shadow-float: 0 14px 34px rgba(24, 24, 27, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow-x: hidden;
      padding-bottom: calc(104px + env(safe-area-inset-bottom));
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-soft);
    }

    .glass-strong {
      background: var(--glass-strong);
      backdrop-filter: blur(26px) saturate(170%);
      -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-soft);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: rgba(244, 244, 245, 0.68);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      border-bottom: 1px solid var(--border-subtle);
    }

    .topbar-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .pill-btn {
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text-main);
      border-radius: var(--pill);
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    .pill-btn.dark {
      background: var(--accent);
      color: #fafafa;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill-btn.dark:hover {
      background: var(--accent-hover);
    }

    .app-shell {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: fadeInSoft 0.24s ease;
    }

    @keyframes fadeInSoft {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-right-panel {
      display: none;
    }

    .slide-right-panel.open {
      display: block;
      animation: slideToRight 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideToRight {
      0% {
        opacity: 0;
        transform: translateX(-48px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .oval-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .oval-card {
      width: 100%;
      border-radius: 999px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease;
    }

    .oval-card:active {
      transform: scale(0.98);
    }

    .oval-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bubble-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--pill);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--border-glass);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .oval-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .oval-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .count-pill {
      background: rgba(63, 63, 70, 0.12);
      color: var(--text-main);
      border-radius: var(--pill);
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .bubble-box {
      border-radius: var(--oval);
      padding: 16px;
      margin-bottom: 14px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .form-row:last-child {
      margin-bottom: 0;
    }

    .pill-input,
    .pill-select {
      flex: 1 1 150px;
      min-width: 0;
      border-radius: var(--pill);
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 11px 16px;
      font-size: 0.92rem;
      color: var(--text-main);
      outline: none;
    }

    .pill-input:focus,
    .pill-select:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    .item-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .food-bubble {
      border-radius: 32px;
      padding: 14px 16px;
    }

    .food-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .food-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .food-name {
      font-weight: 700;
      font-size: 0.98rem;
    }

    .food-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .qty-badge-inline {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 9px;
      border-radius: var(--pill);
      background: rgba(63, 63, 70, 0.11);
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: 700;
      vertical-align: middle;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .circle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--pill);
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .circle-btn:active {
      transform: scale(0.92);
    }

    .qty-num {
      min-width: 22px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .units-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .amount-editor {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--border-subtle);
      border-radius: var(--pill);
      padding: 4px 10px;
      font-size: 0.76rem;
    }

    .amount-editor input {
      border: none;
      background: transparent;
      width: 82px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
    }

    .unit-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--border-subtle);
      border-radius: var(--pill);
      padding: 5px 10px;
      font-size: 0.76rem;
    }

    .unit-chip.expired {
      background: var(--danger-soft);
      color: var(--danger-text);
      border-color: rgba(185, 28, 28, 0.25);
    }

    .unit-chip.soon {
      background: var(--warn-soft);
      color: var(--warn-text);
      border-color: rgba(161, 98, 7, 0.25);
    }

    .unit-chip input[type="date"] {
      border: none;
      background: transparent;
      font-size: 0.75rem;
      color: inherit;
      font-family: inherit;
      padding: 0;
      width: auto;
    }

    .total-bubble {
      border-radius: var(--pill);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .total-amount {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .empty-bubble {
      border-radius: var(--pill);
      padding: 22px 18px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .dock-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 35;
      padding: 0 16px;
      pointer-events: none;
    }

    .dock {
      pointer-events: auto;
      max-width: 520px;
      margin: 0 auto;
      border-radius: var(--pill);
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      box-shadow: var(--shadow-float);
    }

    .dock-btn {
      border: none;
      background: transparent;
      border-radius: var(--pill);
      padding: 10px 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dock-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(24, 24, 27, 0.2);
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(24, 24, 27, 0.36);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 410px;
      border-radius: 34px;
      padding: 22px;
    }

    .modal-card h2 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }

    .modal-card p {
      margin: 0 0 14px;
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .code-pill {
      border-radius: var(--pill);
      background: rgba(255, 255, 255, 0.85);
      border: 1px dashed rgba(63, 63, 70, 0.35);
      padding: 11px 16px;
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 class="brand-title">Casa &amp; Spesa</h1>
        <div class="brand-sub" id="statusLabel">Connessione al cloud...</div>
      </div>
      <button class="pill-btn" id="roomBtn" type="button">🏠 Casa: ---</button>
    </div>
  </header>

  <main class="app-shell">
    <!-- MACRO SEZIONE 1: LISTA DELLA SPESA -->
    <section id="view-spesa" class="view active">
      <div class="bubble-box glass">
        <form id="shoppingForm">
          <div class="form-row">
            <input type="text" id="shopName" class="pill-input" placeholder="Cosa comprare? (es. Uova, Latte, Pasta...)" required />
            <input type="text" id="shopAmount" class="pill-input" style="max-width: 120px;" placeholder="Quantità (es. 500g, 1L)" />
            <input type="number" id="shopQty" class="pill-input" style="max-width: 78px;" min="1" value="1" aria-label="Unità" title="Numero unità" />
          </div>
          <div class="form-row">
            <select id="shopTargetSection" class="pill-select">
              <option value="dispensa">Destinazione: Dispensa</option>
              <option value="frigorifero">Destinazione: Frigorifero</option>
              <option value="congelatore">Destinazione: Congelatore</option>
            </select>
            <button type="submit" class="pill-btn dark">Aggiungi</button>
          </div>
        </form>
      </div>

      <div id="shoppingListContainer" class="item-stack"></div>
    </section>

    <!-- MACRO SEZIONE 2: CASA -->
    <section id="view-casa" class="view">
      <div id="casaMenu">
        <div class="oval-grid">
          <button type="button" class="oval-card glass" data-open-storage="dispensa">
            <div class="oval-left">
              <span class="bubble-icon" aria-hidden="true">🫙</span>
              <div>
                <div class="oval-title">Dispensa</div>
                <div class="oval-desc">Pasta, farina, cioccolata, legumi, conserve</div>
              </div>
            </div>
            <span class="count-pill" id="count-dispensa">0</span>
          </button>

          <button type="button" class="oval-card glass" data-open-storage="frigorifero">
            <div class="oval-left">
              <span class="bubble-icon" aria-hidden="true">🥛</span>
              <div>
                <div class="oval-title">Frigorifero</div>
                <div class="oval-desc">Uova, latte, formaggi, affettati, verdure</div>
              </div>
            </div>
            <span class="count-pill" id="count-frigorifero">0</span>
          </button>

          <button type="button" class="oval-card glass" data-open-storage="congelatore">
            <div class="oval-left">
              <span class="bubble-icon" aria-hidden="true">🧊</span>
              <div>
                <div class="oval-title">Congelatore</div>
                <div class="oval-desc">Carni, pesce, surgelati, gelati, pane</div>
              </div>
            </div>
            <span class="count-pill" id="count-congelatore">0</span>
          </button>
        </div>
      </div>

      <div id="storageDetailPanel" class="slide-right-panel">
        <div class="form-row" style="align-items: center; margin-bottom: 12px;">
          <button type="button" class="pill-btn" id="backToCasaBtn">← Casa</button>
          <span class="pill-btn glass-strong" id="currentStorageTitle" style="cursor: default;">Dispensa</span>
        </div>

        <div class="bubble-box glass">
          <form id="pantryForm">
            <div class="form-row">
              <select id="foodPresetSelect" class="pill-select">
                <option value="">Catalogo alimenti italiani...</option>
              </select>
              <input type="text" id="foodCustomName" class="pill-input" placeholder="Oppure scrivi alimento..." />
            </div>
            <div class="form-row">
              <input type="text" id="foodAmountLabel" class="pill-input" style="max-width: 130px;" placeholder="Quantità (es. 500 g, 1 L)" />
              <input type="number" id="foodInitialQty" class="pill-input" style="max-width: 82px;" min="1" value="1" aria-label="Unità" title="Numero unità" />
              <input type="date" id="foodInitialExpiry" class="pill-input" aria-label="Scadenza iniziale" />
              <button type="submit" class="pill-btn dark">+ Inserisci</button>
            </div>
          </form>
        </div>

        <div id="storageItemsContainer" class="item-stack"></div>
      </div>
    </section>

    <!-- MACRO SEZIONE 3: SPESE -->
    <section id="view-spese" class="view">
      <div class="total-bubble glass-strong">
        <div>
          <div style="font-size: 0.78rem; color: var(--text-muted);">Totale speso</div>
          <div style="font-size: 0.75rem; color: var(--text-
